/* v4 modern field atlas */
:root{--green:#154d5b;--green2:#117a82;--sea:#267f83;--ink:#173346;--muted:#637888;--paper:#ffffff;--bg:#f2f6f9;--line:#e2eaf0;--soft:#e5f1f2;--gold:#fdbe74;--light:#e7f2f4;--shadow:0 15px 35px rgba(28,57,77,.045)}
body{background:radial-gradient(circle at 80% 1%,#e2f3f3 0,transparent 310px),var(--bg)}

.card,.stat,.compact-tile{background:#fff;box-shadow:0 12px 26px rgba(21,54,77,.035)}

.kv,.compact-tile{background:#f8fbfd}.kv strong{color:#18465a}
.info-banner{background:#e8f3f6;border:1px solid #d6e8ed;color:#376174}.info-banner strong{color:#155366}
.action{background:#e9f5f5;border-color:#d2e8ec;color:#126673}.action.primary{background:#135f6d;border-color:#135f6d}
.nav-btn.on{color:#126c79}.nav-btn.on::before{background:#e5f4f5}.note-muted{color:#8294a0}
.district-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}

.district-detail{animation:fadeIn .25s ease-out}.back-link{border:0;background:transparent;color:#217883;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin:15px 0 14px;padding:8px 0;cursor:pointer}

  padding:7px 0 10px;margin-bottom:8px;background:rgba(242,246,249,.96);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);

'use strict';
const DATA={"mimika":{"name":"Mimika","center":"Timika","province":"Papua Tengah","population":"325.596","popYear":"Semester I 2026 · Disdukcapil","area":"21.693,51","district":"18","identity":"Kota tambang, pesisir, dan pegunungan","summary":"Timika adalah pusat kegiatan Kabupaten Mimika. Wilayahnya memanjang dari pesisir dan rawa di selatan sampai pegunungan di utara; industri pertambangan menjadi bagian penting ekonomi setempat.","lead":"Kenali kontras antara Timika yang relatif urban, kawasan pertambangan Tembagapura, dan distrik pesisir serta pedalaman dengan akses yang berbeda.","history":"Kabupaten Mimika dibentuk berdasarkan UU No. 45 Tahun 1999 dan diresmikan sebagai kabupaten definitif pada 2000. Pada Juni 2001 ditetapkan 12 distrik; kini tercatat 18 distrik.","terrain":"Pesisir menghadap Laut Arafura; dataran rendah berawa, wilayah pegunungan hingga Jayawijaya. Hujan dan kelembapan tinggi; suhu pesisir umumnya hangat.","border":"Utara: Paniai, Nabire, Puncak Jaya, Puncak, Dogiyai, Deiyai. Selatan: Laut Arafura. Timur: Jayawijaya dan Yahukimo. Barat: Kaimana. (Sumber: Pemkab Mimika, 2026)","economy":"Pertambangan, perdagangan, jasa, dan aktivitas pelabuhan; pusat perdagangan dan layanan terkonsentrasi di Timika.","people":"Amungme dan Damal di wilayah pegunungan; Kamoro serta Sempan di pesisir. Timika juga dihuni warga pendatang dari banyak daerah Indonesia.","languages":"Bahasa Indonesia dan Melayu Papua membantu percakapan antarkomunitas. Kamoro memiliki banyak variasi dialek; bahasa Amungme juga dikenal sebagai Amung-kal atau Damal-kal menurut wilayah dan penyebutannya.","culture":"Seni ukir masyarakat Kamoro; kuliner yang dicatat Wikipedia antara lain sagu tindis dan ikan bakar colo. Hormati tokoh adat serta aturan komunitas ketika masuk kampung.","careTitle":"RSUD Timika dan RS Mitra Masyarakat","care":"Artikel Wikipedia mencantumkan RSUD Timika di Wonosari Jaya dan Rumah Sakit Mitra Masyarakat di Timika Jaya, serta beberapa rumah sakit dan fasilitas kesehatan lain.","healthExtra":"Cari puskesmas dan apotek terdekat dari alamat tinggalmu. Bila bertugas ke distrik terpencil, pastikan rencana rujukan dan perjalanan medis sebelum berangkat.","travelTitle":"Bandara Mozes/Moses Kilangin · Pelabuhan Pomako","travel":"Bandara Mozes Kilangin melayani akses udara ke Timika; Pelabuhan Pomako penting untuk konektivitas laut. Transportasi menuju pegunungan dan pesisir tidak selalu sama dengan perjalanan dalam kota.","daily":"Untuk hunian dan urusan harian, mulailah dari kawasan Timika. Periksa jarak kantor–rumah, listrik, jaringan seluler, air, dan transportasi. Kawasan pertambangan tertentu dapat memerlukan izin akses.","visits":[{"type":"Alam","name":"Hutan Mangrove Pomako","detail":"Menjelajahi ekosistem pesisir dan mangrove."},{"type":"Kawasan","name":"Kuala Kencana","detail":"Kawasan terencana; cek ketentuan akses sebelum berkunjung."},{"type":"Sejarah","name":"Kota Tua Kokonao","detail":"Mengenal jejak sejarah permukiman pesisir."},{"type":"Budaya","name":"Festival Budaya Amung & Kamoro","detail":"Seni dan tradisi lokal; jadwal acara perlu dicek."}],"peopleNote":"Nama yang terkait dengan sejarah dan masyarakat Mimika, bukan daftar tokoh terkini.","persons":[{"name":"Yosepha Alomang","role":"Pejuang hak masyarakat adat di sekitar pertambangan.","url":"https://id.wikipedia.org/wiki/Yosepha_Alomang"},{"name":"Mozes Kilangin","role":"Tokoh perjuangan; namanya digunakan untuk bandara Timika.","url":"https://id.wikipedia.org/wiki/Mozes_Kilangin"}],"headsUp":"Prioritaskan hunian di wilayah yang memudahkan mobilitas kerja. Perjalanan ke area tambang atau pesisir memerlukan perencanaan akses yang berbeda.","essentials":[{"i":"◷","title":"Zona waktu","desc":"WIT (UTC+9), lebih cepat 1 jam dari WITA."},{"i":"☁","title":"Kondisi alam","desc":"Hujan tinggi, dataran rendah lembap, pegunungan lebih sejuk."},{"i":"✦","title":"Pusat kegiatan","desc":"Timika untuk layanan dan aktivitas sehari-hari."}],"checklist":["Pastikan alamat kantor dan jarak dari calon tempat tinggal.","Simpan kontak rumah sakit, puskesmas, dan orang kantor.","Tanyakan akses transportasi ke lokasi kerja di luar Timika.","Periksa kualitas jaringan, air, listrik, dan kebutuhan hunian.","Siapkan perlindungan hujan dan pencegahan gigitan nyamuk."],"sources":[{"name":"Kabupaten Mimika","url":"https://id.wikipedia.org/wiki/Kabupaten_Mimika"},{"name":"Bahasa Melayu Papua","url":"https://id.wikipedia.org/wiki/Bahasa_Melayu_Papua"},{"name":"Kuala Kencana","url":"https://en.wikipedia.org/wiki/Kuala_Kencana"}],"km":"21.693,51","motto":"Eme Neme Yauware","date":"4 Oktober 1999","admin":"94.04","kelurahan":"19","kampung":"133","altKampung":"","density":"15,0","cityDesc":"Pusat ekonomi dan layanan: Timika. Wilayah lain meliputi pesisir, rawa, dan pegunungan.","districts":["Mimika Baru","Agimuga","Mimika Timur","Mimika Barat","Jita","Jila","Mimika Timur Jauh","Mimika Tengah","Kuala Kencana","Tembagapura","Mimika Barat Jauh","Mimika Barat Tengah","Kwamki Narama","Hoya","Iwaka","Wania","Amar","Alama"],"highlight":"Timika, kawasan Tembagapura, dan kampung-kampung pesisir punya kebutuhan perjalanan yang sangat berbeda.","weather":"Tropis lembap dengan hujan tinggi. Suhu pegunungan jauh lebih sejuk daripada pesisir.","food":"Sagu tindis, ikan bakar colo; ragam makanan nusantara juga mudah dijumpai di Timika.","habits":"Saat masuk wilayah adat, mulai dengan memperkenalkan diri dan meminta persetujuan tokoh setempat. Jangan memotret orang, rumah adat, atau kegiatan ritual tanpa izin.","transportTip":"Akses ke wilayah pegunungan atau pesisir memerlukan konfirmasi moda, izin, dan keamanan; jangan menyamakan perjalanan itu dengan mobilitas dalam Timika.","facilities":"Wikipedia menyebut RSUD Timika dan RS Mitra Masyarakat. Lokasi dan jam layanan sebaiknya diverifikasi langsung.","notes":["Timika merupakan ibu kota kabupaten, bukan nama resmi kabupatennya.","Akses tertentu di kawasan pertambangan bersifat terbatas.","Bahasa Indonesia paling aman untuk komunikasi awal; Melayu Papua banyak digunakan informal."],"relChristian":71.98,"relMuslim":27.89,"relLabel":"Kristen 71,98% · Islam 27,89%"},"nabire":{"name":"Nabire","center":"Nabire","province":"Papua Tengah","population":"180.190","popYear":"estimasi tengah 2025 · BPS","area":"12.075","district":"15","identity":"Ibu kota provinsi di Teluk Cenderawasih","summary":"Nabire berada di pesisir utara Papua, menghadap Teluk Cenderawasih. Kabupaten dan kotanya menjadi pusat pemerintahan Provinsi Papua Tengah serta layanan dan perdagangan kawasan.","lead":"Nabire lebih erat dengan pesisir Teluk Cenderawasih, aktivitas pemerintah dan perdagangan, serta akses menuju distrik pedalaman.","history":"Kabupaten Nabire berdiri pada 10 September 1969. Sejak pemekaran provinsi Papua pada 2022, Kota Nabire menjadi pusat pemerintahan Provinsi Papua Tengah.","terrain":"Wilayah pantai, dataran rendah, dan perbukitan/pedalaman. Beriklim tropis lembap dan memiliki wilayah yang rawan gempa; pahami prosedur evakuasi tempat tinggal.","border":"Utara: kawasan perairan menuju Kepulauan Yapen • Timur: Waropen dan Paniai • Selatan: Dogiyai • Barat: Teluk Wondama dan Kaimana.","economy":"Pemerintahan, perdagangan, perikanan, pertanian dan jasa; sebagian besar layanan terpusat di Distrik Nabire.","people":"Suku asli yang disebut Wikipedia mencakup Wate, Yerisyam, Hegure, Moor, dan Dani. Ada pula masyarakat pendatang dari berbagai daerah.","languages":"Bahasa Indonesia digunakan luas; Melayu Papua berguna sebagai bahasa percakapan lintas kelompok. Bahasa lokal beragam sesuai komunitas adat setempat.","culture":"Nabire memiliki tradisi masyarakat pesisir dan pedalaman, termasuk rumah tradisional Emawa yang dicatat Wikipedia. Hormati aturan pemilik wilayah adat ketika melakukan kegiatan lapangan.","careTitle":"Rumah sakit umum dan puskesmas","care":"Wikipedia mencatat 1 rumah sakit umum di Distrik Nabire dan 32 puskesmas (5 rawat inap, 27 non-rawat inap) pada data tahun 2024.","healthExtra":"Jangan mengandalkan satu daftar faskes: konfirmasi lokasi, layanan gawat darurat, BPJS/asuransi, apotek, serta rujukan jika harus pergi ke luar kota.","travelTitle":"Bandara Douw Aturure · Pelabuhan Samabusa","travel":"Bandara Douw Aturure menjadi gerbang perjalanan udara; Pelabuhan Samabusa melayani angkutan laut. Sebagian jalan menuju distrik luar kota berkondisi menantang.","daily":"Fasilitas perdagangan, transportasi, dan layanan paling terkonsentrasi di area kota Nabire. Jika bekerja di daerah luar kota, cek kondisi jalan, moda perjalanan, dan waktu cadangan.","visits":[{"type":"Bahari","name":"Kwatisore & Teluk Cenderawasih","detail":"Kawasan wisata laut terkenal, termasuk peluang mengamati hiu paus."},{"type":"Pantai","name":"Pantai Gedo","detail":"Pilihan wisata pesisir yang dikenal di Nabire."},{"type":"Pulau","name":"Pulau Ahe","detail":"Pulau dengan potensi wisata pantai dan bawah laut."},{"type":"Air terjun","name":"Air Terjun Bihewa","detail":"Alternatif wisata alam di wilayah Nabire."}],"peopleNote":"Tokoh kelahiran maupun yang dikenal berkiprah di Nabire.","persons":[{"name":"Patrich Wanggai","role":"Pesepakbola nasional, lahir di Nabire.","url":"https://id.wikipedia.org/wiki/Patrich_Wanggai"},{"name":"Mesak Magai","role":"Tokoh pemerintahan yang menjabat Bupati Nabire.","url":"https://id.wikipedia.org/wiki/Mesak_Magai"}],"headsUp":"Karena Nabire berada di kawasan aktif tektonik, kenali titik kumpul dan jalur evakuasi hunian. Untuk penugasan luar kota, periksa kondisi jalan dan cuaca.","essentials":[{"i":"◷","title":"Zona waktu","desc":"WIT (UTC+9), lebih cepat 1 jam dari WITA."},{"i":"⌁","title":"Bentang alam","desc":"Pesisir Teluk Cenderawasih dan wilayah perbukitan."},{"i":"✦","title":"Pusat kegiatan","desc":"Kota Nabire; ibu kota Provinsi Papua Tengah."}],"checklist":["Cari hunian dekat kantor dan akses kebutuhan sehari-hari.","Catat faskes, apotek, dan prosedur rujukan setempat.","Periksa opsi perjalanan dari Bandara Douw Aturure.","Pelajari rute evakuasi gempa dari tempat tinggal.","Cek kondisi jalan sebelum ke distrik pedalaman."],"sources":[{"name":"Kabupaten Nabire","url":"https://id.wikipedia.org/wiki/Kabupaten_Nabire"},{"name":"Kota Nabire","url":"https://en.wikipedia.org/wiki/Nabire"},{"name":"Patrich Wanggai","url":"https://id.wikipedia.org/wiki/Patrich_Wanggai"}],"km":"12.075,00","motto":"Nabire yang Berkeadilan, Sejahtera, dan Makmur","date":"10 September 1969","admin":"94.01","kelurahan":"9","kampung":"72","altKampung":"","density":"14,9","cityDesc":"Pusat pemerintahan Provinsi Papua Tengah, perdagangan, dan gerbang menuju kawasan Teluk Cenderawasih.","districts":["Nabire","Napan","Yaur","Uwapa","Wanggar","Siriwo","Makimi","Teluk Umar","Teluk Kimi","Yaro","Wapoga","Nabire Barat","Kepulauan Moora","Dipa","Menou"],"highlight":"Banyak layanan terpusat di Distrik Nabire; perjalanan ke distrik luar kota dapat memerlukan waktu dan persiapan tambahan.","weather":"Pesisir tropis lembap; perlu mengenali langkah siaga gempa dan lokasi evakuasi.","food":"Salak Nabire dikenal sebagai komoditas lokal unggulan. Kuliner pesisir berbahan ikan juga mudah ditemukan.","habits":"Kenali siapa kepala kampung, pemilik hak ulayat, dan tokoh lokal sebelum mengadakan kegiatan komunitas.","transportTip":"Akses utama melalui Bandara Douw Aturure dan pelabuhan; kondisi jalan ke distrik luar kota bervariasi.","facilities":"Wikipedia memuat data tahun 2024: 1 RS umum, 32 puskesmas, 11 klinik pratama, dan 59 apotek. Bukan data operasional langsung.","notes":["Kota Nabire menjadi ibu kota Provinsi Papua Tengah sejak pembentukan provinsi baru pada 2022.","Kabupaten Nabire dan Kota Nabire bukan dua kabupaten yang berbeda.","Nabire pernah mengalami gempa besar pada 2004."],"relChristian":62.22,"relMuslim":37.38,"relLabel":"Kristen 62,22% · Islam 37,38%"},"asmat":{"name":"Asmat","center":"Agats","province":"Papua Selatan","population":"120.902","popYear":"2024","area":"25.015,31","district":"25","identity":"Kota di atas rawa, sungai, dan budaya ukir","summary":"Kabupaten Asmat didominasi dataran rendah berawa, sungai, dan wilayah pasang surut. Agats adalah pusat pemerintahannya, dikenal dengan jalan panggung dan kedekatannya dengan kehidupan sungai.","lead":"Di Asmat, sungai bukan sekadar panorama: transportasi air merupakan bagian utama konektivitas antarkampung dan antardistrik.","history":"Kabupaten Asmat dibentuk pada 25 Oktober 2002 melalui pemekaran dari Merauke. Ibu kotanya Agats, yang sejak lama menjadi pusat kegiatan masyarakat pesisir.","terrain":"Dataran rendah rawa dan sungai menghadap Laut Arafura, dengan curah hujan tinggi. Banyak rumah serta jalur di Agats dibangun lebih tinggi menyesuaikan kondisi pasang surut.","border":"Utara: Jayawijaya dan Yahukimo • Timur: Mappi • Selatan: Laut Arafura • Barat: Mimika.","economy":"Kegiatan masyarakat mencakup menangkap ikan, mencari dan mengolah sagu, serta seni ukir kayu dan kerajinan.","people":"Suku Asmat adalah kelompok masyarakat utama, bersama komunitas Papua lainnya dan para pendatang. Seni ukir dan upacara adat memiliki peran penting dalam identitas setempat.","languages":"Bahasa Asmat digunakan dengan keragaman lokal; Bahasa Indonesia dan Melayu Papua membantu komunikasi lintas komunitas. Belajar sapaan bersama warga lebih baik daripada menganggap semua dialek sama.","culture":"Ukiran kayu khas Asmat, termasuk tiang leluhur (mbis/bisj), adalah simbol budaya penting. Mintalah izin sebelum memotret orang, karya seni, atau upacara adat.","careTitle":"RSUD di Agats","care":"Artikel Wikipedia tentang Agats mencatat keberadaan rumah sakit umum di kota tersebut (sering disebut RSUD Agats dalam sumber rujukannya). Layanan di distrik jauh mungkin membutuhkan perjalanan air.","healthExtra":"Siapkan rencana rujukan, persediaan obat pribadi sesuai kebutuhan, nomor petugas lokal, serta air minum yang aman. Jangan menganggap moda rujukan selalu tersedia setiap waktu.","travelTitle":"Bandara Ewer · Dermaga Agats · Perahu","travel":"Akses udara menuju kawasan Agats melalui Bandara Ewer; perjalanan dilanjutkan transportasi lokal. Antardistrik tidak tersambung jaringan jalan darat menyeluruh; speedboat, longboat, dan sampan penting.","daily":"Perhatikan pasang surut, perencanaan perjalanan perahu, kualitas sumber air bersih, serta perlindungan barang dari kelembapan. Jadwal dan biaya transportasi perlu diverifikasi sebelum berangkat.","visits":[{"type":"Museum","name":"Museum Kebudayaan dan Kemajuan Asmat","detail":"Koleksi seni, ukiran, dan kisah budaya masyarakat Asmat."},{"type":"Budaya","name":"Festival Budaya Asmat","detail":"Agenda seni ukir dan budaya; pastikan jadwal terkini."},{"type":"Kota","name":"Agats","detail":"Menjelajah suasana kota panggung dan kawasan tepi sungai."},{"type":"Tradisi","name":"Seni ukir Asmat","detail":"Belajar dari pengukir dan perajin setempat dengan menghormati adat."}],"peopleNote":"Tokoh terkait pemerintahan dan pelestarian budaya Asmat; tidak semuanya berasal dari suku Asmat.","persons":[{"name":"Thomas Eppe Safanpo","role":"Tokoh pemerintahan dan Bupati Asmat.","url":"https://id.wikipedia.org/wiki/Thomas_Eppe_Safanpo"},{"name":"Alphonse Sowada","role":"Uskup misionaris yang mendukung pendirian museum Asmat.","url":"https://en.wikipedia.org/wiki/Asmat_Museum_of_Culture_and_Progress"}],"headsUp":"Prioritas pendatang: transportasi air yang aman, air minum, akses layanan kesehatan, serta koordinasi lokal sebelum bepergian. Jangan berangkat ke kampung jauh tanpa rencana komunikasi dan kepulangan.","essentials":[{"i":"◷","title":"Zona waktu","desc":"WIT (UTC+9), lebih cepat 1 jam dari WITA."},{"i":"≈","title":"Kondisi alam","desc":"Rawa dan sungai pasang surut; curah hujan tinggi."},{"i":"✦","title":"Pusat kegiatan","desc":"Agats, ibu kota Kabupaten Asmat."}],"checklist":["Konfirmasi perjalanan Bandara Ewer ke Agats.","Siapkan rencana perjalanan air dan kontak operator lokal.","Pastikan sumber air minum serta kebutuhan harian di hunian.","Simpan informasi fasilitas kesehatan dan rujukan darurat.","Bawa tas tahan air, jas hujan, dan pelindung barang elektronik."],"sources":[{"name":"Kabupaten Asmat","url":"https://id.wikipedia.org/wiki/Kabupaten_Asmat"},{"name":"Kota Agats","url":"https://en.wikipedia.org/wiki/Agats"},{"name":"Museum Asmat","url":"https://en.wikipedia.org/wiki/Asmat_Museum_of_Culture_and_Progress"},{"name":"Bandara Ewer","url":"https://en.wikipedia.org/wiki/Ewer_Airport"}],"km":"25.015,31","motto":"Ja Asamanam Apcamar","date":"25 Oktober 2002","admin":"93.04","kelurahan":"—","kampung":"224","altKampung":"","density":"±4,8","cityDesc":"Agats adalah ibu kota kabupaten di lanskap rawa dan sungai; jalur air menjadi penghubung penting.","districts":["Agats","Atsj","Sawa Erma","Akat","Fayit","Pantai Kasuari","Suator","Suru-suru","Kolf Braza","Unir Sirau","Joerat","Pulau Tiga","Jetsy","Der Koumur","Kopay","Safan","Sirets","Ayib","Betcbamu","Aswi","Awyu","Joutu","Koroway Buluanop","Sor Ep","Tomor Birip"],"highlight":"Di Asmat, akses antardistrik umumnya mengandalkan perahu; jadwal, pasang surut, cuaca, dan bahan bakar penting untuk dipastikan.","weather":"Dataran rendah rawa-pasang-surut, hujan tinggi dan udara lembap; lindungi perangkat elektronik dari air.","food":"Sagu dan hasil perairan memegang peranan penting dalam keseharian komunitas.","habits":"Ukiran Asmat memiliki makna budaya dan spiritual; jangan menganggap semua karya atau lokasi ritual boleh difoto/dibeli bebas.","transportTip":"Wikipedia menyebut tidak ada jalan darat yang menghubungkan antardistrik; longboat dan speedboat banyak dipakai.","facilities":"Akses faskes dan rujukan antarwilayah dapat memerlukan transportasi air/udara. Konfirmasi fasilitas yang beroperasi sebelum bepergian.","notes":["Agats adalah pusat pemerintahan Kabupaten Asmat.","Di banyak tempat jalur panggung menggantikan jalan tanah biasa.","Transportasi air adalah kebutuhan dasar, bukan semata-mata aktivitas wisata."],"relChristian":93.69,"relMuslim":6.27,"relLabel":"Kristen 93,69% · Islam 6,27%"}};

function stats(d){return `<div class="stats"><div class="stat"><strong>${esc(d.population)}</strong><label>Penduduk<small>${d.popYear} · jiwa</small></label></div><div class="stat"><strong>${esc(d.km)}</strong><label>Luas wilayah<small>km²</small></label></div><div class="stat"><strong>${esc(d.district)}</strong><label>Distrik<small>administratif</small></label></div><div class="stat"><strong>${esc(d.density)}</strong><label>Kepadatan<small>jiwa / km²</small></label></div></div>`}
function home(d){return hero(d)+stats(d)+card(heading('bookmark','Kenalan singkat',`Kabupaten ${d.name}`),`<p class="body-copy">${esc(d.cityDesc)}</p><div class="info-banner"><strong>Yang perlu kamu ingat.</strong> ${esc(d.highlight)}</div><div class="action-row">${buttonTo(1,'Profil wilayah','map')}${buttonTo(2,'Bandingkan kabupaten','compass')}</div>`)+`<div class="page-head"><div><span class="eyelash">INFORMASI PILIHAN</span><h2>Mulai dari sini</h2></div><span class="page-tag">5 menu</span></div><div class="detail-pair"><div class="compact-tile"><span class="tile-icon">${svg('building')}</span><strong>Penduduk & distrik</strong><p>Sejarah, batas wilayah, jumlah kampung dan daftar distrik.</p>${buttonTo(1,'Buka','arrow')}</div><div class="compact-tile"><span class="tile-icon">${svg('users')}</span><strong>Budaya & bahasa</strong><p>Suku asli, ragam bahasa, adat dan kuliner khas.</p>${buttonTo(3,'Buka','arrow')}</div><div class="compact-tile"><span class="tile-icon">${svg('compass')}</span><strong>Transportasi & wisata</strong><p>Akses, objek menarik, dan tokoh yang dikenal.</p>${buttonTo(4,'Buka','arrow')}</div><div class="compact-tile"><span class="tile-icon">${svg('heart')}</span><strong>Kesehatan & fasilitas</strong><p>Fasilitas kesehatan, akses layanan, dan lokasi penting.</p>${buttonTo(4,'Buka','arrow')}</div></div>`+footnote()}
function districtTile(name,idx){const p=DISTRICT_PROFILES[region+'::'+name]||{};return `<button type="button" class="district-tile" data-district="${esc(name)}" aria-label="Buka profil Distrik ${esc(name)}"><span class="district-tile-no">${String(idx+1).padStart(2,'0')}</span><span class="district-tile-copy"><strong>${esc(name)}</strong><small>${esc(p.tag||'Distrik')}</small></span><span class="district-tile-arrow">${svg('arrow','ico-sm')}</span></button>`}
function districtDirectory(d){return card(heading('search',`Direktori ${d.district} distrik`,'Ketuk distrik untuk membaca profil dan kampungnya'),`<div class="district-bar">${svg('search')}<input id="districtSearch" type="search" placeholder="Cari dari ${esc(d.district)} distrik..." aria-label="Pencarian distrik" autocomplete="off"></div><div class="directory-meta"><span>${esc(d.district)} distrik aktif</span><span>Ketuk kartu untuk detail ↗</span></div><div id="districtResults" class="district-grid">${d.districts.map(districtTile).join('')}</div><div class="info-banner"><strong>Catatan data administratif.</strong> Daftar kampung Mimika dan Nabire di sini dirujuk dari Wikipedia (Juli 2022); untuk Asmat, daftar 25 distrik mengikuti pemerintah daerah. Angka penduduk distrik dan fasilitas yang belum terverifikasi tidak ditampilkan sebagai fakta.</div>`) }
function wilayah(d){if(selectedDistrict && d.districts.includes(selectedDistrict))return districtProfile(d,selectedDistrict);return `<div class="page-head"><div><span class="eyelash">01 / ATLAS PAPUA</span><h2>Wilayah & distrik</h2><p>Penduduk, geografi, administrasi dan 58 profil distrik.</p></div><span class="page-tag">2026</span></div>`+stats(d)+`<div class="grid-desktop">`+card(heading('landmark','Pemerintahan'),`<div class="detail-pair"><div class="kv"><small>Provinsi</small><strong>${esc(d.province)}</strong></div><div class="kv"><small>Ibu kota</small><strong>${esc(d.center)}</strong></div><div class="kv"><small>Distrik</small><strong>${esc(d.district)}</strong></div><div class="kv"><small>Kelurahan</small><strong>${esc(d.kelurahan)}</strong></div><div class="kv"><small>Kampung</small><strong>${esc(d.kampung)}</strong></div><div class="kv"><small>Kode wilayah</small><strong>${esc(d.admin)}</strong></div></div>`)+card(heading('map','Bentang alam & perbatasan'),`<p class="body-copy">${esc(d.lead)} ${esc(d.terrain)}</p><div class="kv"><small>Batas wilayah</small><strong class="kv-long">${esc(d.border)}</strong></div><div class="kv"><small>Cuaca</small><strong class="kv-long">${esc(d.weather)}</strong></div>`)+`</div>`+card(heading('users','Penduduk dan masyarakat'),`<p class="body-copy">${esc(d.people)}</p><p class="note-muted">Jumlah penduduk pada kartu atas adalah tingkat kabupaten (bukan total distrik yang dihitung ulang).</p>`)+card(heading('calendar','Sejarah singkat'),`<div class="history-row"><div><b>Hari jadi / pembentukan</b><p>${esc(d.date)}</p></div></div><p class="body-copy">${esc(d.history)}</p>`)+districtDirectory(d)+footnote()}
function districtProfile(d,name){const p=DISTRICT_PROFILES[region+'::'+name]||{},r=DISTRICT_SOURCE[region],v=(p.villages||'').split(',').map(x=>x.trim()).filter(Boolean);const route=mapUrl('Distrik '+name+', Kabupaten '+d.name+', Papua, Indonesia');return `<div class="district-detail"><button class="back-link" id="districtBack" type="button">${svg('arrow','ico-sm')} <span>Kembali ke semua distrik</span></button><section class="district-detail-hero"><div class="micro">PROFIL DISTRIK · ${esc(d.province)}</div><div class="district-detail-label">${esc(p.tag||'Administrasi wilayah')}</div><h2>${esc(name)}</h2><p>Bagian dari Kabupaten ${esc(d.name)} · ${esc(d.province)}</p><div class="district-tags"><span>${svg('pin','ico-sm')} ${esc(d.name)}</span><span>${svg('globe','ico-sm')} WIT UTC+9</span><span>${svg('book','ico-sm')} Sumber terlampir</span></div></section><div class="district-detail-controls"><a href="${esc(route)}" target="_blank" rel="noopener noreferrer" class="action primary">${svg('map','ico-sm')} Buka peta</a></div>`+card(heading('info','Kenali distrik'),`<p class="body-copy">${esc(p.desc||'Profil singkat distrik.')}</p><div class="info-banner"><strong>Akses wilayah:</strong> ${esc(p.access)}</div>`)+card(heading('landmark','Pusat dan administrasi'),`<div class="detail-pair"><div class="kv"><small>Nama distrik</small><strong>${esc(name)}</strong></div><div class="kv"><small>Ibukota kabupaten</small><strong>${esc(d.center)}</strong></div>${region==='asmat'?`<div class="kv"><small>Pusat distrik*</small><strong>${esc(p.center||'Belum terverifikasi')}</strong></div>`:`<div class="kv"><small>Daftar kampung*</small><strong>${v.length} nama</strong></div>`}<div class="kv"><small>Provinsi</small><strong>${esc(d.province)}</strong></div></div>${v.length?`<div class="village-list">${v.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:`<p class="note-muted">Daftar kampung per distrik Asmat belum dimasukkan karena perlu pemeriksaan administratif lebih rinci pada publikasi BPS. Tautan resmi tersedia di bawah.</p>`}<p class="note-muted">* ${region==='asmat'?'Sebagian pusat distrik bersumber dari tabel dokumen perencanaan daerah; tanda “—” berarti belum terverifikasi.':'Nama kampung/kelurahan dari daftar Wikipedia Juli 2022. Kemungkinan ejaan atau batas telah berubah.'}</p>`)+card(heading('heart','Kesehatan, penduduk & kebutuhan lapangan'),`<div class="info-row"><div><strong>Jumlah penduduk distrik</strong><small>Belum dimuat — verifikasi pada BPS kecamatan dalam angka.</small></div><span>Perlu data</span></div><div class="info-row"><div><strong>Puskesmas & fasilitas</strong><small>Periksa nama fasilitas dan status operasional terbaru melalui BPS/Dinas Kesehatan.</small></div><span>Perlu data</span></div><div class="info-row"><div><strong>Rute & waktu perjalanan</strong><small>Bergantung kampung tujuan, musim, dan transportasi yang tersedia.</small></div><span>Perlu cek</span></div>`)+card(heading('book','Referensi profil'),`<div class="sources">${link(r.url,r.name)}${link(r.bps,'BPS Kabupaten dalam Angka 2026')}${link(r.gov,'Pemerintah Kabupaten')}</div><p class="note-muted">Konten profil merupakan ringkasan pengenalan wilayah; bukan penilaian langsung kondisi keamanan atau layanan terkini.</p>`)+`<button class="back-link bottom-back" id="districtBackBottom" type="button">${svg('arrow','ico-sm')} Semua distrik ${esc(d.name)}</button></div>` }
function budaya(d){return `<div class="page-head"><div><span class="eyelash">02 / MASYARAKAT</span><h2>Budaya & bahasa</h2><p>Memahami komunitas tempat kamu tinggal.</p></div></div>`+card(heading('users','Suku & masyarakat'),`<p class="body-copy">${esc(d.people)}</p><div class="info-banner"><strong>Sikap saat berkunjung.</strong> ${esc(d.habits)}</div>`)+card(heading('globe','Bahasa sehari-hari'),`<p class="body-copy">${esc(d.languages)}</p><div class="quote" style="margin-top:13px"><strong>Catatan:</strong> Melayu Papua digunakan sebagai bahasa perantara, tetapi variasi ungkapan berbeda menurut komunitas. Gunakan Bahasa Indonesia terlebih dahulu jika belum akrab.</div>`)+card(heading('book','3 ungkapan Melayu Papua'),`<div class="phrase-grid"><div class="phrase"><b>Sa bantu ko</b><small>Saya bantu kamu</small></div><div class="phrase"><b>Sa mo pi</b><small>Saya mau pergi</small></div><div class="phrase"><b>De makan sagu</b><small>Dia makan sagu</small></div></div><p class="note-muted">Contoh pengenalan informal; bukan glosarium bahasa adat.</p>`)+card(heading('coffee','Kesenian, kuliner & adat'),`<p class="body-copy">${esc(d.culture)}</p><div class="kv"><small>Pangan / kuliner lokal</small><strong style="font-weight:550;line-height:1.7">${esc(d.food)}</strong></div><p class="note-muted">Makanan khas tidak selalu tersedia setiap hari; ketersediaan tergantung kampung dan musim.</p>`)+card(heading('shield','Etika bertamu'),`<div class="pill-row"><span class="pill">Sapa tokoh masyarakat</span><span class="pill">Minta izin dokumentasi</span><span class="pill">Hormati adat setempat</span><span class="pill">Dengarkan penerjemah lokal</span><span class="pill">Jangan berasumsi semua kampung sama</span></div>`) }
function jelajah(d){return `<div class="page-head"><div><span class="eyelash">03 / AKSES & EKSPLORASI</span><h2>Jelajah ${esc(d.center)}</h2><p>Transportasi, wisata, ekonomi & tokoh.</p></div></div>`+card(heading('heart','Kesehatan & fasilitas'),`<p class="body-copy">${esc(d.care)}</p><p class="note-muted">${esc(d.healthExtra)}</p><div class="sources">${[['Rumah sakit','rumah sakit'],['Puskesmas','puskesmas'],['Apotek','apotek']].map(x=>link(mapUrl(x[1]+' dekat '+d.center+', '+d.province),x[0]+' di peta')).join('')}</div><p class="note-muted">Tautan peta menampilkan hasil pencarian. Nama dan jam operasional fasilitas perlu dicek sebelum berkunjung.</p>`)+card(heading('plane','Transportasi'),`<p class="body-copy"><b style="color:#365e52">${esc(d.travelTitle)}</b> — ${esc(d.travel)}</p><div class="info-banner"><strong>Untuk perjalanan kerja:</strong> ${esc(d.transportTip)}</div><div class="action-row">${link(mapUrl(`${d.center}, ${d.province}, Indonesia`),'Lihat pusat kota di peta')}</div>`)+card(heading('building','Ekonomi & kehidupan harian'),`<p class="body-copy">${esc(d.economy)}</p><div class="kv"><small>Adaptasi pendatang</small><strong style="font-size:12px;font-weight:500;line-height:1.75">${esc(d.daily)}</strong></div>`)+`<div class="page-head"><div><span class="eyelash">REKOMENDASI LOKASI</span><h2>Wisata & tempat menarik</h2></div></div><div class="place-grid">${d.visits.map(v=>`<article class="place"><span class="type">${esc(v.type)}</span><strong>${esc(v.name)}</strong><p>${esc(v.detail)}</p>${link(mapUrl(`${v.name}, ${d.name}, Indonesia`),'Cari di peta')}</article>`).join('')}</div><p class="note-muted">Akses dan jam kunjung tempat wisata perlu dicek. Link peta adalah hasil pencarian, bukan titik lokasi yang sudah diverifikasi.</p>`+card(heading('users','Tokoh yang dikenal'),`<p class="body-copy" style="margin-bottom:8px">${esc(d.peopleNote)}</p>${d.persons.map(p=>`<div class="person"><div class="avatar">${esc(p.name.split(' ').slice(0,2).map(w=>w[0]).join(''))}</div><div><b>${link(p.url,p.name)}</b><small>${esc(p.role)}</small></div></div>`).join('')}`)}
















// Perbandingan kabupaten: seleksi 2/3 wilayah, filter kategori, dan statistik bertahun rujukan.
const CMP=window.PAPUA_COMPARISON;

const groupList=['Semua','Geografi','Mobilitas','Layanan','Ekonomi','Sosial','Risiko & Lapangan'];
const metricDefs=[
 {key:'population',label:'Jumlah penduduk',note:'Tahun sumber berbeda — hanya gambaran besaran',unit:'jiwa',calc:r=>Number(DATA[r].population.replace(/\./g,'')),display:(n)=>n.toLocaleString('id-ID'),tag:r=>DATA[r].popYear},
 {key:'area',label:'Luas wilayah',note:'Luas administratif kabupaten',unit:'km²',calc:r=>parseFloat(DATA[r].km.replace(/\./g,'').replace(',','.')),display:n=>n.toLocaleString('id-ID',{maximumFractionDigits:2}),tag:r=>'Data profil kabupaten'},
 {key:'district',label:'Jumlah distrik',note:'Jumlah administratif dalam direktori aplikasi',unit:'distrik',calc:r=>DATA[r].districts.length,display:n=>n.toLocaleString('id-ID'),tag:r=>'Daftar distrik'},
 {key:'density',label:'Kepadatan indikatif',note:'Penduduk dibagi luas; tahun penduduk tidak seragam',unit:'jiwa/km²',calc:r=>Number(DATA[r].population.replace(/\./g,''))/parseFloat(DATA[r].km.replace(/\./g,'').replace(',','.')),display:n=>n.toLocaleString('id-ID',{maximumFractionDigits:1}),tag:r=>'Perhitungan dari angka di atas'},
 {key:'female',label:'IPM perempuan',note:'BPS 2025 · indikator menurut jenis kelamin, bukan IPM total',unit:'poin',calc:r=>CMP.ipmSex2025[r].female,display:n=>n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}),tag:r=>'BPS · 2025'},
 {key:'male',label:'IPM laki-laki',note:'BPS 2025 · indikator menurut jenis kelamin, bukan IPM total',unit:'poin',calc:r=>CMP.ipmSex2025[r].male,display:n=>n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}),tag:r=>'BPS · 2025'},
 {key:'gap',label:'Selisih IPM L–P',note:'Selisih dua nilai di atas, bukan ukuran penyebab ketimpangan',unit:'poin',calc:r=>CMP.ipmSex2025[r].male-CMP.ipmSex2025[r].female,display:n=>n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}),tag:r=>'Hitungan · BPS 2025'}
];
function comparisonInsights(){const selected=REGIONS.filter(r=>compareSelection.includes(r)),key=selected.join(',');return CMP.insights[key]||CMP.insights.all}
function cmpMetricCard(def){const values=compareSelection.map(r=>({r,n:def.calc(r)})),max=Math.max(...values.map(x=>x.n));return `<article class="cmp-metric"><div class="cmp-metric-head"><span>${esc(def.label)}</span><small>${esc(def.unit)}</small></div>${values.map(({r,n})=>`<div class="cmp-metric-item"><div class="cmp-metric-label"><strong>${esc(DATA[r].name)}</strong><b>${esc(def.display(n))}</b></div><div class="cmp-bar-track"><span class="cmp-bar cmp-bar-${r}" style="width:${(max>0?Math.max(n/max*100,2):0).toFixed(1)}%"></span></div><span class="cmp-metric-year">${esc(def.tag(r))}</span></div>`).join('')}<p class="cmp-metric-note">${esc(def.note)}</p></article>`}
function cmpAspectCard(aspect,index){return `<article class="cmp-aspect"><div class="cmp-aspect-header"><span class="cmp-counter">${String(index+1).padStart(2,'0')}</span><div><span class="cmp-eyebrow">${esc(aspect.group)} · Ringkasan kontekstual</span><h3>${esc(aspect.title)}</h3><p>${esc(aspect.context)}</p></div></div><div class="cmp-aspect-values">${compareSelection.map(r=>{const v=aspect.values[r];return `<div class="cmp-region-card cmp-region-${r}"><div class="cmp-region-head"><span class="cmp-dot cmp-dot-${r}"></span><strong>${esc(DATA[r].name)}</strong><small>${esc(DATA[r].center)}</small></div><p>${esc(v.short)}</p>${compareDetail?`<div class="cmp-region-detail">${esc(v.detail)}</div>`:''}</div>`}).join('')}</div>${compareDetail?`<div class="cmp-meaning"><b>Makna perbandingan</b><span>${esc(aspect.meaning)}</span></div>`:''}</article>`}
function perbandingan(){const sourceLinks=compareSelection.map(r=>{const s=CMP.sources[r];return `<div>${link(s.url,s.title)}<span>${link(s.wiki,'Wikipedia '+DATA[r].name)}</span></div>`}).join('');const list=CMP.aspects.filter(a=>compareGroup==='Semua'||a.group===compareGroup);const highlights=comparisonInsights();return `<section class="cmp-top" aria-label="Perbandingan kabupaten"><span class="cmp-micro">REGIONAL INSIGHTS · EDISI 2026</span><h1>Melihat Papua<br><em>dari berbagai sisi.</em></h1><p>Bandingkan Mimika, Nabire, dan Asmat melalui angka, profil wilayah, serta analisis yang membedakan kondisi perkotaan dan distrik terpencil.</p><div class="cmp-top-foot"><span>02–03 wilayah</span><span>18 aspek</span><span>Data & interpretasi dibedakan</span></div></section>`+
card(`<div class="cmp-select-head"><div><span class="eyelash">PILIH PERBANDINGAN</span><h3>Wilayah yang dibandingkan</h3><p>Pilih dua atau tiga kabupaten. Tombol wilayah di atas tetap untuk melihat profil masing-masing.</p></div><span class="cmp-selected-count">${compareSelection.length} terpilih</span></div>`,`<div class="cmp-presets" role="group" aria-label="Pilihan cepat wilayah">${[['Semua','mimika,nabire,asmat'],['Mimika + Nabire','mimika,nabire'],['Mimika + Asmat','mimika,asmat'],['Nabire + Asmat','nabire,asmat']].map(([label,keys])=>`<button class="cmp-preset ${compareSelection.join(',')===keys?'active':''}" type="button" data-cmp-preset="${keys}">${esc(label)}</button>`).join('')}</div><div class="cmp-region-choices" role="group" aria-label="Tentukan dua atau tiga wilayah">${REGIONS.map(r=>`<label class="cmp-choice ${compareSelection.includes(r)?'selected':''}"><input type="checkbox" data-cmp-toggle="${r}" ${compareSelection.includes(r)?'checked':''} aria-label="Bandingkan ${DATA[r].name}"><span class="cmp-checkmark"></span><strong>${esc(DATA[r].name)}</strong><small>${esc(DATA[r].province)}</small></label>`).join('')}</div><p class="cmp-helper">Minimal dua wilayah. Semua perbandingan bersifat tingkat kabupaten, bukan penilaian seragam untuk tiap distrik.</p>`, 'cmp-control')+
`<div class="page-head cmp-section-head"><div><span class="eyelash">01 / ANGKA UTAMA</span><h2>Potret dalam angka</h2><p>Bar membandingkan besar angka, bukan mutu atau peringkat kualitas.</p></div><span class="page-tag">7 indikator</span></div>`+
`<div class="cmp-metrics">${metricDefs.map(cmpMetricCard).join('')}</div>`+
`<div class="cmp-warning"><strong>Perhatian sumber & periode.</strong> Jumlah penduduk memakai <b>Mimika semester I 2026</b>, <b>Nabire estimasi tengah 2025</b>, dan <b>Asmat 2024</b>. Jangan mengartikannya sebagai pertumbuhan antardaerah pada tahun yang sama. Indikator IPM laki-laki/perempuan menggunakan satu tahun yang sama, yaitu <b>BPS 2025</b>.</div>`+
`<div class="page-head cmp-section-head"><div><span class="eyelash">02 / PEMBACAAN LINTAS WILAYAH</span><h2>Apa yang paling berbeda?</h2><p>Sintesis kualitatif berdasarkan karakter yang terdokumentasi.</p></div></div>`+
`<div class="cmp-insights">${highlights.map(([h,p],i)=>`<article class="cmp-insight"><span class="cmp-insight-index">${String(i+1).padStart(2,'0')}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join('')}</div>`+
`<div class="page-head cmp-section-head" id="cmpAspects"><div><span class="eyelash">03 / MATRIKS MULTI-ASPEK</span><h2>Analisis per aspek</h2><p>${list.length} dari 18 dimensi · pilih kelompok atau baca lebih mendalam.</p></div></div>`+
`<div class="cmp-filter-row" role="group" aria-label="Filter aspek analisis">${groupList.map(g=>`<button class="cmp-filter ${compareGroup===g?'active':''}" type="button" data-cmp-group="${esc(g)}" aria-pressed="${compareGroup===g}">${esc(g)}</button>`).join('')}</div><div class="cmp-viewbar"><span>${esc(compareSelection.map(r=>DATA[r].name).join(' · '))}</span><button type="button" class="cmp-detail-toggle" id="cmpDetailToggle" aria-pressed="${compareDetail}">${compareDetail?'− Tampilan ringkas':'+ Lihat analisis detail'}</button></div>`+
`<div class="cmp-aspect-list">${list.map((a,i)=>cmpAspectCard(a,i)).join('')}</div>`+
`<div class="page-head cmp-section-head"><div><span class="eyelash">04 / JEJAK DATA</span><h2>Sumber & batasan</h2><p>Selalu cocokkan tahun dan definisi ketika menggunakan perbandingan.</p></div></div>`+
card(heading('bookmark','Sumber primer dan referensi'),`<div class="cmp-sources">${sourceLinks}<div>${link(CMP.sources.ipm.url,CMP.sources.ipm.title)}</div></div><p class="note-muted">Angka kependudukan/luas mengikuti data yang sudah ditampilkan pada profil kabupaten dalam aplikasi. Narasi kualitatif adalah sintesis karakter wilayah dari profil, publikasi dan referensi yang tertera; bukan hasil survei layanan, survei harga, atau evaluasi kinerja pemerintah.</p>`) +
`<div class="cmp-endnote">Tidak ada skor “kabupaten terbaik”. Hasil perbandingan dimaksudkan untuk memahami <strong>perbedaan konteks</strong>, bukan menentukan mutu layanan, keamanan saat ini, atau kelayakan intervensi tanpa data lapangan.</div>`}
function updateComparison(){if(page!==2)return;const y=window.scrollY;$('#page').innerHTML=perbandingan();attachPageEvents();window.scrollTo({top:y,behavior:'instant'});}
function bindCompareEvents(){
 document.querySelectorAll('[data-cmp-preset]').forEach(b=>b.addEventListener('click',()=>{const arr=b.dataset.cmpPreset.split(',');compareSelection=REGIONS.filter(x=>arr.includes(x));updateComparison()}));
 document.querySelectorAll('[data-cmp-toggle]').forEach(b=>b.addEventListener('change',()=>{const id=b.dataset.cmpToggle;const selection=new Set(compareSelection);if(b.checked)selection.add(id);else if(selection.size>2)selection.delete(id);else{b.checked=true;notify('Pilih minimal dua kabupaten');return;}compareSelection=REGIONS.filter(r=>selection.has(r));updateComparison()}));
 document.querySelectorAll('[data-cmp-group]').forEach(b=>b.addEventListener('click',()=>{compareGroup=b.dataset.cmpGroup;updateComparison()}));
 const toggle=$('#cmpDetailToggle');if(toggle)toggle.addEventListener('click',()=>{compareDetail=!compareDetail;updateComparison()});
}

const renderers=[home,wilayah,perbandingan,budaya,jelajah];
function notify(t){clearTimeout(toastTimer);let e=$('#toast');e.textContent=t;e.classList.add('show');toastTimer=setTimeout(()=>e.classList.remove('show'),2300)}
function getSaved(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function putSaved(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
// Page swaps keep the sticky header and region selector stable.
const REDUCED_MOTION=window.matchMedia('(prefers-reduced-motion: reduce)');
let navVersion=0,navAnimation=null,directoryScroll=0;
function changeView(update,opts={}){
  const panel=$('#page');const version=++navVersion;
  if(navAnimation){navAnimation.cancel();navAnimation=null}
  function commit(){if(version!==navVersion)return;update();render();if(opts.scroll!==false)window.scrollTo({top:opts.scrollY??0,behavior:'instant'});}
  if(REDUCED_MOTION.matches||!panel.animate){commit();return}
  const distance=opts.direction===-1?'12px':'-12px';
  const exitAnim=panel.animate([{opacity:1,transform:'translate3d(0,0,0)'},{opacity:.15,transform:`translate3d(${distance},0,0)`}],{duration:110,easing:'ease-in',fill:'forwards'});
  navAnimation=exitAnim;
  exitAnim.finished.then(()=>{
    if(version!==navVersion)return;
    exitAnim.cancel();navAnimation=null;commit();
    const enterFrom=opts.direction===-1?'-15px':'15px';
    const anim=panel.animate([{opacity:.2,transform:`translate3d(${enterFrom},5px,0)`},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:275,easing:'cubic-bezier(.2,.8,.2,1)'});
    navAnimation=anim;anim.finished.then(()=>{if(navAnimation===anim)navAnimation=null}).catch(()=>{});
  }).catch(()=>{});
}
function setRegion(r){if(!DATA[r]||region===r)return;changeView(()=>{selectedDistrict=null;region=r;putSaved('pf-region',r)},{direction:1})}
function go(n){if(n<0||n>=renderers.length)return;if(n===page&&!selectedDistrict){window.scrollTo({top:0,behavior:'smooth'});return}
  const direction=n>=page?1:-1;changeView(()=>{if(n!==1)selectedDistrict=null;page=n;putSaved('pf-page-v6',page)},{direction})}
function render(){const d=DATA[region];$('#page').innerHTML=renderers[page](d);
  document.querySelectorAll('.region-btn').forEach(b=>{const on=b.dataset.region===region;b.setAttribute('aria-selected',String(on))});
  document.querySelectorAll('.nav-btn').forEach(b=>{const on=+b.dataset.page===page;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#dots').innerHTML=MENU.map((_,i)=>`<i class="${i===page?'on':''}"></i>`).join('');
  document.title=`${page===2?"Bandingkan Mimika, Nabire & Asmat":d.name+" — "+MENU[page]} | Papua Field Notes`;attachPageEvents();}
function attachPageEvents(){
  if(page===2)bindCompareEvents();
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
  const search=$('#districtSearch');if(search){const arr=DATA[region].districts;search.addEventListener('input',()=>{
    const q=search.value.toLocaleLowerCase('id').trim();const found=arr.map((t,i)=>({t,i})).filter(o=>o.t.toLocaleLowerCase('id').includes(q)||((DISTRICT_PROFILES[region+'::'+o.t]||{}).tag||'').toLocaleLowerCase('id').includes(q));
    $('#districtResults').innerHTML=found.length?found.map(o=>districtTile(o.t,o.i)).join(''):'<p class="empty-state">Distrik tidak ditemukan.</p>';bindDistrictTiles();})}
  function bindDistrictTiles(){document.querySelectorAll('[data-district]').forEach(b=>b.addEventListener('click',()=>{
    const name=b.dataset.district;directoryScroll=window.scrollY;
    changeView(()=>{selectedDistrict=name},{direction:1});}))}
  bindDistrictTiles();document.querySelectorAll('#districtBack,#districtBackBottom').forEach(b=>b.addEventListener('click',()=>{
    changeView(()=>{selectedDistrict=null},{direction:-1,scrollY:directoryScroll});}));
}
document.querySelectorAll('.region-btn').forEach(b=>b.addEventListener('click',()=>setRegion(b.dataset.region)));
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.page)));
$('#brand').addEventListener('click',e=>{e.preventDefault();go(0)});
$('#shareBtn').addEventListener('click',async()=>{const url=location.href.split('#')[0];if(navigator.share){try{await navigator.share({title:'Papua Field Notes',text:'Atlas distrik Mimika, Nabire, dan Asmat',url})}catch{}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(url);notify('Tautan disalin')}catch{notify('Bagikan tautan situs dari browser')}}else notify('Bagikan tautan situs dari browser')});
// Swipe navigation supports five sections and avoids input/button interactions.
let sx=0,sy=0,st=0,drag=false;const view=$('#page');view.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,textarea,a,button')){drag=false;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();drag=true},{passive:true});
view.addEventListener('touchend',e=>{if(!drag||e.changedTouches.length!==1)return;drag=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.45&&Date.now()-st<1000){go(Math.max(0,Math.min(renderers.length-1,page+(dx<0?1:-1))))}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(Math.min(renderers.length-1,page+1));if(e.key==='ArrowLeft')go(Math.max(0,page-1))});
const sr=getSaved('pf-region','mimika');if(DATA[sr])region=sr;const sp=getSaved('pf-page-v6',0);if(Number.isInteger(sp)&&sp>=0&&sp<renderers.length)page=sp;render();




















if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
